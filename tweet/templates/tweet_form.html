{% extends "layout.html" %}

{% block title  %}

web page

{% endblock %}

{% block content  %}
<h2 class= "text-center mt-5">Welcome to Web page for tweet</h2>
<h5>{% if form.instance.pk %}
    Edit Tweet
    {% else %}
    Create Tweet
    {% endif %}
    <form method= "POST" enctype="multipart/form-data" class= "form">
         {% csrf_token %} 
        {{ form.as_p }}
    <button class= "btn btn-warning" type="submit">
        Submit
    </button>
    </form> 
    <a href="{% url 'tweet_list'%}">Back to Tweet List</a>


</h5>
{% endblock %}
